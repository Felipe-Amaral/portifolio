name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Instalar Chromium para renderizar diagramas Mermaid
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Verificar que não há script inline (CSP)
        run: |
          if grep -rlE '<script(\s[^>]*)?>[^<]' dist --include=*.html; then
            echo "Encontrado <script> inline: a CSP vai bloquear." && exit 1
          fi

      # O mesmo dist/ testado acima é o que vai para produção (um único build).
      - name: Guardar dist para o deploy
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Só o Wrangler é necessário aqui; o site não é buildado de novo.
      - name: Instalar dependências
        run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy na Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
