name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Verificar que não há script inline (CSP)
        run: |
          if grep -rlE '<script(\s[^>]*)?>[^<]' dist --include=*.html; then
            echo "Encontrado <script> inline: a CSP vai bloquear." && exit 1
          fi
